<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head><body class="h-screen overflow-hidden bg-gradient-to-br from-white via-purple-50 to-purple-100 text-gray-900"><div id="popup" class="fixed inset-0 flex items-center justify-center z-50 backdrop-blur-2xl bg-white/70">
  <div class="text-center max-w-sm w-[90%] p-8 rounded-3xl bg-white/80 shadow-2xl">
    <h1 class="text-3xl font-semibold mb-3">Hey…👀</h1>
    <p class="text-gray-500 mb-6 leading-relaxed">Edi Kazhuthehhh…😂🤍</p>
    <button onclick="openFirst()" class="w-full py-3 bg-purple-600 text-white rounded-2xl text-sm tracking-wide hover:scale-105 transition">
      Open
    </button>
  </div>
</div><div id="first" class="hidden fixed inset-0 flex flex-col items-center justify-center bg-gradient-to-br from-white via-purple-50 to-purple-100 px-4">
  <div class="w-full max-w-md">
    <img src="https://media.tenor.com/IBxdvql1Mk0AAAAM/cat-kiss.gif" id="gif1" 
         class="w-full h-[80vh] object-cover rounded-3xl mb-6 opacity-0 shadow-2xl" />
  </div>
  <p class="text-gray-400 text-sm tracking-wide">wait…</p>  <span class="absolute bottom-4 right-5 text-sm text-purple-500 opacity-80">
    miss you
  </span>
</div><div id="second" class="hidden fixed inset-0 flex items-center justify-center bg-gradient-to-br from-white via-purple-50 to-purple-100 px-4">
  <div class="max-w-md w-full text-center"><img src="https://media.tenor.com/35kEGWD6s7QAAAAM/couple-calm.gif" 
     class="w-full h-[60vh] object-cover rounded-3xl mb-8 shadow-2xl" />

<h1 class="text-3xl md:text-4xl font-semibold mb-5 leading-snug">
  No matter what happens…🍃
</h1>

<p class="text-gray-600 text-base leading-relaxed">
  I’ll be right here. In the calm moments, in the chaos,
  and even in the silence you don’t explain.🥺🤍
</p>

<p class="text-gray-500 mt-5 text-sm leading-relaxed">
  Not perfect. Not flawless. Just real.
  And I’ll keep choosing you — every single day.🕊️💗
</p>

  </div>  <span class="absolute bottom-4 right-5 text-sm text-purple-500 opacity-80 text-uppercase">
    Miss You🫴💗
  </span>
</div><script>
function openFirst() {
  document.getElementById('popup').style.display = 'none';
  const first = document.getElementById('first');
  const gif1 = document.getElementById('gif1');

  first.classList.remove('hidden');

  setTimeout(() => {
    gif1.classList.remove('opacity-0');
    gif1.classList.add('transition','duration-1000','opacity-100');
  }, 300);

  setTimeout(() => {
    first.classList.add('hidden');
    document.getElementById('second').classList.remove('hidden');
  }, 4500);
}
</script></body>
</html>
